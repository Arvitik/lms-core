
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_IMAGE_TAG: ${PHP_IMAGE_TAG:-7.4-fpm}
    container_name: lms_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_IMAGE_TAG: ${PHP_IMAGE_TAG:-7.4-fpm}
    container_name: lms_scheduler
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: lms_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: lms_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lms}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "33060:3306"
    volumes:
      - lms_db_data:/var/lib/mysql
      - ./uir.sql:/docker-entrypoint-initdb.d/uir.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: lms_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 256M
    depends_on:
      db:
        condition: service_healthy

volumes:
  lms_db_data:
